<!DOCTYPE html>
<html lang="pt-br">
    {% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}
            SAYS
        {% endblock %}
    </title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    
    <div class="window-confirm hidden" id="confirm-modal" role="dialog" aria-modal="true" aria-hidden="true">
        <p id="confirm-message"></p>
        <div class="confirm-actions">
          <button type="button" id="confirm-cancel">cancel</button>
          <button type="button" id="confirm-ok">confirm</button>
        </div>
    </div>

    <header>
        {%if user.is_authenticated %}
                <h2>SAYS, {{ user.username }}!</h2>
        {% else %}
            <h2>SAYS!</h2>
        {% endif %}
        <nav style="display: flex; gap: 10px;">
            <a href="{% url 'home' %}">home</a>
            <a href="{% url 'posts' %}">posts</a>

            {%if user.is_authenticated %}
                <a href='{% url 'logout' %}' class="confirm-logout">logout</a>
            {% else %}
                <a href='{% url 'login' %}'>login</a>
            {% endif %}
            
        </nav>
    </header>
    <main>
        {% block content %}

        {% endblock %}
    </main>
    <script>

      const confirmModal = document.querySelector('#confirm-modal');
      let pendingForm = null;
      let pendingLink = null;

      const messageConfirm = confirmModal.querySelector('#confirm-message');
      const confirmOk = document.querySelector('#confirm-ok');
      const confirmCancel = document.querySelector('#confirm-cancel');
      
      document.addEventListener('click', (e) => {
        const btn = e.target.closest('button.delete, button.deletecomment');
        if (btn) {
          e.preventDefault();
          pendingForm = btn.closest('form');
          pendingLink = null;
          messageConfirm.textContent = btn.dataset.confirmMessage || 'Are you sure?';
          confirmModal.classList.remove('hidden');
          confirmModal.setAttribute('aria-hidden', 'false');
          return;
        }

        const link = e.target.closest('a.confirm-logout');
        if (link) {
          e.preventDefault();
          pendingLink = link;
          pendingForm = null;
          messageConfirm.textContent = link.dataset.confirmMessage || 'Are you going?';
          confirmModal.classList.remove('hidden');
          confirmModal.setAttribute('aria-hidden', 'false');
        }
      });

      const closeModal = () => {
        confirmModal.classList.add('hidden');
        confirmModal.setAttribute('aria-hidden', 'true');
        pendingForm = null;
        pendingLink = null;
      };

      confirmCancel.addEventListener('click', closeModal);
      confirmOk.addEventListener('click', () => {
        if (pendingForm) pendingForm.submit();
        if (pendingLink) window.location.href = pendingLink.href;
        closeModal();
      });

    </script>
</body>
</html>
